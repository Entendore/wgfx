[package]
name = "wgfx"
version = "0.1.0"
edition = "2021"
description = "A custom Rust WebGPU rendering engine"
license = "MIT"

[dependencies]
wgpu = { version = "22", features = ["wgsl"] }
winit = { version = "0.29", features = ["x11"] }
pollster = "0.3"
glam = "0.27"
bytemuck = { version = "1.14", features = ["derive"] }
env_logger = "0.11"
log = "0.4"
thiserror = "1.0"
rand = "0.8"

[dev-dependencies]
anyhow = "1.0"

[[example]]
name = "batch2d"
path = "examples/batch2d.rs"

[[example]]
name = "sprites"
path = "examples/sprites.rs"

[[example]]
name = "3d_scene"
path = "examples/3d_scene.rs"

[[example]]
name = "particles"
path = "examples/particles.rs"
